# This workflow will run tests and publish the package when a release is created
# For more information: https://docs.github.com/ru/actions/quickstart

name: Publish

on:
  release:
    types: [created]
#  push:
#    branches:
#      - 'main'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22 LTS is used to BUILD the package (install, test, build, publish).
          # It is not the minimum runtime Node version of the published library.
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm test
      - run: npm run check-types
      - run: npm run build
      - run: npm publish
        #      - run: npm publish --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
